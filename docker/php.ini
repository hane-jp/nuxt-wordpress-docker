; ==========================================
; PHP settings for WordPress (Docker local dev)
; ==========================================

; Upload limits
upload_max_filesize = 2000M
post_max_size = 2000M

; Memory limit for plugins / builders
memory_limit = 2048M

; Execution settings (avoid timeout during large imports)
max_execution_time = 300
max_input_time = 300

; Allow larger file input
max_file_uploads = 100

; Error reporting (good for local development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Opcache (kept simple for dev)
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Timezone (prevents PHP warnings)
date.timezone = UTC